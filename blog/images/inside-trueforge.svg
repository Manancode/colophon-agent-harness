<svg viewBox="0 0 720 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="colophon inside trueforge">
  <rect x="0" y="0" width="720" height="280" fill="#ffffff"/>
  <defs>
    <marker id="arwb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1c1c1e"/>
    </marker>
  </defs>
  <g font-family="Inter,-apple-system,Segoe UI,Roboto,sans-serif">
    <rect x="14" y="14" width="692" height="252" rx="16" fill="#ffffff" stroke="#1c1c1e" stroke-width="1.5"/>
    <text x="30" y="42" font-size="14" font-weight="700" fill="#1c1c1e">trueforge, the agent harness (loop, tool-calling, sandbox, approvals)</text>

    <rect x="40"  y="64" width="150" height="44" rx="10" fill="#ffffff" stroke="#1c1c1e" stroke-width="1.5"/>
    <text x="115" y="84"  font-size="12.5" fill="#1c1c1e" text-anchor="middle">agent</text>
    <text x="115" y="100" font-size="10.5" fill="#6b7280" text-anchor="middle">reads verdict, edits spec</text>

    <rect x="240" y="64" width="190" height="44" rx="10" fill="#ffffff" stroke="#1c1c1e" stroke-width="2"/>
    <text x="335" y="84"  font-size="12.5" fill="#1c1c1e" text-anchor="middle">colophon_validate</text>
    <text x="335" y="100" font-size="10.5" fill="#6b7280" text-anchor="middle">mcp tool, 14 gates</text>

    <rect x="470" y="64" width="210" height="44" rx="10" fill="#ffffff" stroke="#1c1c1e" stroke-width="1.5"/>
    <text x="575" y="84"  font-size="12"   fill="#1c1c1e" text-anchor="middle">{ state, blockers, hint }</text>
    <text x="575" y="100" font-size="10"   fill="#6b7280" text-anchor="middle">named gate + code</text>

    <path d="M190,86 L240,86" stroke="#1c1c1e" stroke-width="1.5" marker-end="url(#arwb)"/>
    <path d="M430,86 L470,86" stroke="#1c1c1e" stroke-width="1.5" marker-end="url(#arwb)"/>
    <path d="M575,108 C575,150 335,150 335,108" fill="none" stroke="#1c1c1e" stroke-width="1.5"
          stroke-dasharray="5 4" marker-end="url(#arwb)"/>
    <text x="450" y="142" font-size="10.5" fill="#6b7280">agent re-runs the gate after fixing the spec</text>

    <text x="30" y="196" font-size="12" fill="#1c1c1e">other tools: colophon_gates, colophon_init, colophon_plan, colophon_qa, colophon_design, colophon_doctor</text>
    <text x="30" y="222" font-size="12" fill="#6b7280">every answer is { state, blockers, warnings, hint }. no write or destructive flags, the loop never stalls.</text>
    <text x="30" y="250" font-size="11.5" font-weight="700" fill="#1c1c1e">remove the mcp server and colophon still runs end to end from the cli. trueforge is a seam, not a lock-in.</text>
  </g>
</svg>
