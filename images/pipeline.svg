<svg viewBox="0 0 720 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="the colophon pipeline">
  <rect x="0" y="0" width="720" height="220" fill="#ffffff"/>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1c1c1e"/>
    </marker>
  </defs>
  <g font-family="Inter,-apple-system,Segoe UI,Roboto,sans-serif" text-anchor="middle">
    <rect x="6"   y="88" width="92" height="46" rx="9" fill="#ffffff" stroke="#1c1c1e" stroke-width="1.5"/>
    <text x="52"  y="109" font-size="12.5" fill="#1c1c1e">brief + brand</text>
    <text x="52"  y="125" font-size="10.5" fill="#6b7280">and assets</text>

    <rect x="118" y="88" width="92" height="46" rx="9" fill="#ffffff" stroke="#1c1c1e" stroke-width="1.5"/>
    <text x="164" y="109" font-size="12.5" fill="#1c1c1e">canonical spec</text>
    <text x="164" y="125" font-size="10.5" fill="#6b7280">source of truth</text>

    <rect x="230" y="88" width="92" height="46" rx="9" fill="#ffffff" stroke="#1c1c1e" stroke-width="1.5"/>
    <text x="276" y="109" font-size="12.5" fill="#1c1c1e">editable project</text>
    <text x="276" y="125" font-size="10.5" fill="#6b7280">html + css</text>

    <rect x="342" y="88" width="92" height="46" rx="9" fill="#ffffff" stroke="#1c1c1e" stroke-width="1.5"/>
    <text x="388" y="109" font-size="12.5" fill="#1c1c1e">render</text>
    <text x="388" y="125" font-size="10.5" fill="#6b7280">to mp4</text>

    <rect x="454" y="88" width="92" height="46" rx="9" fill="#ffffff" stroke="#1c1c1e" stroke-width="2"/>
    <text x="500" y="109" font-size="12.5" fill="#1c1c1e">deterministic qa</text>
    <text x="500" y="125" font-size="10.5" fill="#6b7280">14 gates, no model</text>

    <rect x="566" y="88" width="92" height="46" rx="9" fill="#ffffff" stroke="#1c1c1e" stroke-width="1.5"/>
    <text x="612" y="109" font-size="12.5" fill="#1c1c1e">review + repair</text>
    <text x="612" y="125" font-size="10.5" fill="#6b7280">edit the spec</text>

    <path d="M98,111 L118,111 M210,111 L230,111 M322,111 L342,111 M434,111 L454,111 M546,111 L566,111"
          stroke="#1c1c1e" stroke-width="1.5" marker-end="url(#arw)"/>

    <text x="360" y="54" font-size="11.5" fill="#6b7280">fails closed, every gate returns a named code</text>
    <text x="360" y="190" font-size="11.5" fill="#6b7280">localized repair: fix the spec, not the video, then launch</text>
  </g>
</svg>
